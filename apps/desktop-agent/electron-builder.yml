appId: com.quazlink.runner
productName: QuazLink Runner
executableName: "QuazLink Runner"
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - .env
  - src/ui/**/*
  - src/assets/**/*
asar: false
mac:
  target: dmg
  icon: src/assets/icon.png
win:
  target: nsis
  icon: src/assets/icon.ico
nsis:
  include: installer.nsh
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: "always"
  createStartMenuShortcut: true
  shortcutName: "QuazLink Runner"
  artifactName: "QuazLink-Runner-Setup-v${version}.${ext}"


