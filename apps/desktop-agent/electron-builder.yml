appId: com.quazlink.runner
productName: QuazLink Runner
executableName: "QuazLink Runner"
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - .env
  - src/ui/**/*
  - src/assets/**/*
asar: true
asarUnpack:
  - "**/node_modules/playwright/**/*"
  - "**/node_modules/playwright-core/**/*"
mac:
  target: dmg
  icon: src/assets/icon.png
win:
  target: nsis
  icon: src/assets/icon.ico
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "QuazLink Runner"

