appId: com.quazlink.runner
productName: QuazLink Runner
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - .env
  - src/ui/**/*
  - src/assets/**/*
mac:
  target: dmg
  icon: src/assets/icon.png
win:
  target: nsis
  icon: src/assets/icon.png
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "QuazLink Runner"
