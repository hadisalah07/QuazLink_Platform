version: '3.8'

networks:
  quazlink_net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_pg_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-saas_automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      quazlink_net:
        aliases:
          - postgres

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      quazlink_net:
        aliases:
          - redis

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secure_pg_password_2026}@postgres:5432/${POSTGRES_DB:-saas_automation}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AIzaSyD_dummy_key}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://app.quazlink.site}
    depends_on:
      - postgres
      - redis
    links:
      - postgres:postgres
      - redis:redis
    ports:
      - "3001:3001"
    networks:
      quazlink_net:
        aliases:
          - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.quazlink.site}
    restart: always
    environment:
      PORT: 3000
      INTERNAL_API_HOST: api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.quazlink.site}
    depends_on:
      - api
    links:
      - api:api
    ports:
      - "3000:3000"
    networks:
      quazlink_net:
        aliases:
          - web

volumes:
  postgres_data:
  redis_data:
