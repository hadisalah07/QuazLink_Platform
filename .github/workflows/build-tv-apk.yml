name: Build QuazHome TV APK

on:
  push:
    paths:
      - 'apps/tv-client/**'
      - '.github/workflows/build-tv-apk.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          cd apps/tv-client
          chmod +x gradlew

      - name: Verify or Generate Release Keystore
        run: |
          if [ -f apps/tv-client/app/release.jks ]; then
            echo "Using committed permanent release keystore"
          else
            echo "Generating new keystore fallback"
            keytool -genkeypair -v \
              -keystore apps/tv-client/app/release.jks \
              -alias quazhome \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass quazlink2026 \
              -keypass quazlink2026 \
              -dname "CN=QuazHome TV, OU=Smart Home, O=QuazLink, L=Cairo, ST=Cairo, C=EG"
          fi

      - name: Build Release APK
        run: |
          cd apps/tv-client
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../../dist-apk/QuazHomeTV.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuazHomeTV-Release-APK
          path: dist-apk/QuazHomeTV.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tv-v1.1.5 || gh release create tv-v1.1.5 dist-apk/QuazHomeTV.apk --title "QuazHome TV v1.1.5 (Platform Edition)" --notes "Official signed release Android TV APK with platform hero typography for QuazHome TV (Q cyan-purple gradient, white uaz, silver Home, neon TV badge), arrow keys allowed for custom shortcuts, and safe enter protection."
          gh release upload tv-v1.1.5 dist-apk/QuazHomeTV.apk --clobber
          gh release upload tv-v1.1.4 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.1.3 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.1.2 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.1.1 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.1.0 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.0.9 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.0.8 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.0.7 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.0.6 dist-apk/QuazHomeTV.apk --clobber || true
          gh release upload tv-v1.0.5 dist-apk/QuazHomeTV.apk --clobber || true
