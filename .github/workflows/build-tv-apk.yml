name: Build QuazHome TV APK

on:
  push:
    paths:
      - 'apps/tv-client/**'
      - '.github/workflows/build-tv-apk.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          cd apps/tv-client
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd apps/tv-client
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist-apk/QuazHomeTV.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuazHomeTV-Debug-APK
          path: dist-apk/QuazHomeTV.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tv-v1.0.0 || gh release create tv-v1.0.0 dist-apk/QuazHomeTV.apk --title "QuazHome TV v1.0.0 (Android TV Edition)" --notes "Official Android TV APK for QuazHome & QuazLink platform."
          gh release upload tv-v1.0.0 dist-apk/QuazHomeTV.apk --clobber
